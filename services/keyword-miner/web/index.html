<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GEO 选词</title>
<style>
  :root {
    --bg: #f3f5f8;
    --card: #fff;
    --line: #e5e8ef;
    --text: #1f2430;
    --muted: #6b7280;
    --brand: #185fa5;
    --brand-soft: #e8f1fb;
    --ok: #2f9e44;
    --warn: #c2410c;
    --soft: #f7f8fb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
  }
  .shell {
    max-width: 1120px;
    margin: 0 auto;
    padding: 20px 18px 48px;
  }
  body.embed {
    background: #fff;
    overflow: hidden;
  }
  body.embed .shell {
    max-width: none;
    width: 100%;
    height: 100%;
    padding: 0;
    display: grid;
    grid-template-rows: 1fr;
    overflow: hidden;
  }
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }
  body.embed .top { display: none !important; }
  .brand-block { display: flex; gap: 12px; align-items: center; }
  .logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--brand); color: #fff; font-weight: 700;
    display: grid; place-items: center; font-size: 16px; letter-spacing: 0.02em;
  }
  h1 { font-size: 19px; margin: 0; font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .work {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  body.embed .work {
    height: 100%;
    min-height: 0;
    grid-template-columns: minmax(320px, 380px) 1fr;
    gap: 0;
    border: 0;
    overflow: hidden;
  }
  @media (max-width: 900px) {
    body.embed .work { grid-template-columns: 1fr; grid-template-rows: minmax(240px, 42%) 1fr; }
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .panel.form {
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
  }
  body.embed .panel {
    border: 0;
    border-radius: 0;
    padding: 14px 14px 18px;
  }
  body.embed .panel.form {
    border-right: 1px solid var(--line);
    background: var(--soft);
    overflow: hidden;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0;
  }
  body.embed .panel.result {
    overflow: hidden;
    min-height: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  .result-scroll {
    flex: 1;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
  }
  .form-body {
    flex: 1;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 14px 14px 8px;
  }
  .form-footer {
    flex-shrink: 0;
    padding: 12px 14px 14px;
    border-top: 1px solid var(--line);
    background: #f0f2f6;
  }
  .form-footer .btn {
    width: 100%;
  }
  .field.is-error input,
  .field.is-error textarea {
    border-color: #e03131;
    box-shadow: 0 0 0 3px rgba(224, 49, 49, 0.12);
  }
  .field-hint {
    margin: -4px 0 10px;
    font-size: 12px;
    color: var(--muted);
  }
  #result:has(.ready) {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.embed .result-scroll:has(.ready) {
    display: flex;
    flex-direction: column;
  }
  body.embed #result:has(.ready) {
    flex: 1;
    min-height: 0;
  }
  body.embed #status:empty,
  body.embed #tools[style*="display: none"] {
    display: none !important;
  }

  .panel-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }
  body.embed .panel-title { display: none; }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 5px;
    font-size: 12.5px;
    color: #374151;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
  textarea, select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13.5px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):focus,
  textarea:focus, select:focus {
    outline: none;
    border-color: #8bb4de;
    box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.12);
  }
  input[type="checkbox"], input[type="radio"] {
    width: 14px;
    height: 14px;
    margin: 2px 0 0;
    padding: 0;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
    accent-color: var(--brand);
    vertical-align: middle;
  }
  input[type="checkbox"]:focus,
  input[type="checkbox"]:focus-visible,
  input[type="radio"]:focus,
  input[type="radio"]:focus-visible {
    outline: none;
    box-shadow: none;
  }
  textarea { resize: vertical; min-height: 72px; }
  .field { margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2.stack-sm { }
  @media (max-width: 560px) {
    .grid2, .grid2.stack-sm { grid-template-columns: 1fr; }
  }

  .plats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .pill {
    display: inline-flex; align-items: center;
    font-size: 12px; border-radius: 8px; padding: 5px 11px;
    background: #eef1f6; color: var(--muted);
    cursor: pointer; user-select: none; border: 1px solid transparent;
  }
  .pill.on {
    background: var(--brand-soft); color: var(--brand);
    border-color: #b7d0ea; font-weight: 650;
  }
  .keyword-tag-box {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 44px;
    padding: 8px 10px;
    border: 1px solid #d8e7f8;
    border-radius: 10px;
    background: #f8fbff;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .keyword-tag-box:focus-within {
    border-color: #8eb8ea;
    box-shadow: 0 0 0 3px rgba(72,128,214,.12);
    background: #fff;
  }
  .keyword-tag-box i {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    max-width: 100%;
    padding: 6px 10px;
    border-radius: 999px;
    font-style: normal;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.3;
    word-break: break-all;
    border: 1px solid #b8d4f5;
    color: #1a5fb4;
    background: #eef5ff;
  }
  .keyword-tag-box i button {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border: 0;
    border-radius: 50%;
    color: #1a5fb4;
    background: #d6e8ff;
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }
  .keyword-tag-box input {
    flex: 1;
    min-width: 140px;
    height: 28px;
    border: 0;
    outline: none;
    color: #17324d;
    background: transparent;
    font-size: 13px;
    font-family: inherit;
    padding: 0;
    box-shadow: none;
  }
  .filehint { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .file-row input[type="file"] {
    display: none;
  }
  .file-row .btn.file-pick {
    padding: 7px 12px;
    font-size: 12.5px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .file-name {
    font-size: 12.5px;
    color: var(--muted);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  .file-name.has-file { color: #374151; }

  .row-actions { display: inline-flex; gap: 6px; flex-wrap: wrap; white-space: nowrap; }
  .row-actions .btn.tiny {
    padding: 3px 8px; font-size: 12px; border-radius: 7px;
  }
  .revise-modal {
    position: fixed; inset: 0; z-index: 80; display: none;
  }
  .revise-modal.open { display: block; }
  .revise-backdrop {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.35);
  }
  .revise-panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(520px, calc(100vw - 28px));
    background: #fff; border-radius: 12px; border: 1px solid var(--line);
    box-shadow: 0 18px 50px rgba(15, 23, 42, 0.18);
    padding: 14px 16px 16px;
  }
  .revise-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .revise-head h2 { margin: 0; font-size: 16px; }
  .revise-word { margin: 8px 0 12px; font-size: 13px; line-height: 1.45; }
  .revise-body { display: flex; flex-direction: column; gap: 10px; }
  .revise-label {
    font-size: 13px; color: var(--muted, #6b7280); margin-bottom: 2px;
  }
  #reviseReason {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font: inherit; background: #fff;
  }
  #reviseCustomText {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font: inherit; resize: vertical;
  }
  .revise-foot {
    display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: auto;
    flex: 1;
    min-height: 0;
    padding: 12px 14px 16px;
  }
  .history-item {
    display: block;
    width: 100%;
    text-align: left;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 10px 10px 9px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text);
  }
  .history-item:hover { border-color: #8bb4de; background: var(--brand-soft); }
  .history-item .row1 {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .history-item .t { font-weight: 650; line-height: 1.35; }
  .history-item .m { color: var(--muted); margin-top: 4px; font-size: 12px; line-height: 1.4; }
  .history-item .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .history-item .tagx {
    font-size: 11px;
    color: #374151;
    background: #eef2f7;
    border-radius: 999px;
    padding: 2px 7px;
  }
  .history-item .s {
    flex-shrink: 0;
    font-size: 11.5px;
    color: var(--brand);
    font-weight: 650;
  }
  .history-item .s.bad { color: var(--warn); }
  .history-item .s.pending { color: #b08900; }

  .result-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 6;
    margin: 0 0 10px;
    padding: 8px 0;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  body.embed .result-bar {
    position: relative;
    top: auto;
    margin: 0 0 0;
    padding: 0 0 10px;
  }
  .result-bar .actions {
    margin: 0;
    flex: 1;
  }
  .hist-drawer {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
  }
  .hist-drawer.open { display: block; }
  .hist-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.28);
  }
  .hist-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: min(400px, 92vw);
    height: 100%;
    background: #fff;
    border-left: 1px solid var(--line);
    box-shadow: -8px 0 28px rgba(15, 23, 42, 0.12);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .hist-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .hist-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
  }
  .hist-head .btn.icon {
    padding: 6px 10px;
    min-width: 0;
    font-size: 13px;
  }
  .hist-filter {
    padding: 10px 14px 0;
    flex-shrink: 0;
  }
  .hist-filter input {
    width: 100%;
  }
  .btn {
    background: var(--brand); color: #fff; border: none;
    padding: 10px 18px; border-radius: 9px;
    font-size: 14px; font-weight: 650; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.ghost {
    background: #fff; color: var(--brand);
    border: 1px solid #c5d4e8;
  }
  .btn.primary-outline { border-color: var(--brand); }

  .banner {
    display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 12.5px; padding: 7px 11px; border-radius: 8px; margin: 0 8px 10px 0;
  }
  .banner.demo { background: #fff7ed; color: var(--warn); }
  .banner.live { background: #ecfdf3; color: var(--ok); }
  .banner.resume {
    background: #eef5ff; color: #1e4b8c;
    width: 100%; box-sizing: border-box; margin: 0 0 10px;
  }
  .banner.resume .btn { padding: 4px 10px; font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .actions {
    display: flex; gap: 8px; align-items: center;
    margin: 0 0 12px; flex-wrap: wrap;
  }
  .muted { color: var(--muted); }
  .empty {
    text-align: left; color: var(--muted);
    padding: 24px; font-size: 13.5px;
  }

  /* Idle / running states */
  .ready {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 28px 24px;
    max-width: 28em;
    box-sizing: border-box;
    text-align: center;
  }
  .ready-head h2 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .ready-head p {
    margin: 0;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.55;
  }
  .ready-run .pulse {
    width: 100%;
    max-width: 220px;
    height: 4px;
    border-radius: 999px;
    background: #e8edf4;
    overflow: hidden;
    margin-top: 8px;
  }
  .ready-run .pulse > i {
    display: block;
    height: 100%;
    width: 40%;
    border-radius: inherit;
    background: var(--brand);
    animation: run-pulse 1.2s ease-in-out infinite;
  }
  @keyframes run-pulse {
    0% { transform: translateX(-20%); }
    100% { transform: translateX(220%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ready-run .pulse > i { animation: none; width: 100%; }
  }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; background: var(--soft); }
  tbody tr:hover { background: var(--brand-soft); }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font-size: 11.5px; background: var(--brand-soft); color: var(--brand);
  }
  .score { font-weight: 700; }
  .bar { height: 5px; border-radius: 4px; background: #eef1f6; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--brand); }
  .stage-h {
    margin: 16px 0 4px; font-size: 13.5px; font-weight: 700; color: var(--brand);
    border-left: 3px solid var(--brand); padding-left: 8px;
  }
  .ans { color: #0a7d4d; font-size: 12px; line-height: 1.45; max-width: 360px; }
  h3 { font-size: 14px; margin: 4px 0 0; }
  body.embed .ding-only { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand-block">
      <div class="logo">G</div>
      <div>
        <h1>GEO 选词</h1>
        <div class="sub">选词 + 拓词 · 导出 Word 交付报告</div>
      </div>
    </div>
  </div>

  <div class="work">
    <section class="panel form">
      <div class="form-body">
        <p class="panel-title">输入</p>
        <div class="grid2">
          <div class="field">
            <label for="company">企业名称</label>
            <input id="company" placeholder="例如：艾迪亚控股集团" autocomplete="organization" />
          </div>
          <div class="field">
            <label for="product">产品 / 服务</label>
            <input id="product" placeholder="例如：品牌推广、企业服务" />
          </div>
        </div>
        <p class="field-hint">企业名称、产品、客户资料至少填一项</p>
        <div class="field">
          <label for="materials">客户资料</label>
          <textarea id="materials" placeholder="粘贴企业介绍、产品说明、官网摘要等"></textarea>
          <div class="file-row">
            <input id="file" type="file" accept=".txt,.md,.csv,.docx" />
            <button type="button" class="btn ghost file-pick" id="filePick">上传资料</button>
            <span class="file-name" id="fileName">未选择文件</span>
          </div>
          <div class="filehint" id="filehint">支持 .txt / .md / .csv / .docx</div>
        </div>
        <div class="field">
          <label for="task">任务类型</label>
          <select id="task">
            <option value="both">选词 + 拓词</option>
            <option value="select">仅选词</option>
            <option value="expand">仅拓词</option>
          </select>
        </div>
        <div class="field">
          <label>目标 AI 平台</label>
          <div class="plats" id="platforms"></div>
        </div>
        <div class="field">
          <label for="web_url">官网 URL</label>
          <input id="web_url" placeholder="https://..." />
        </div>
        <div class="field">
          <label>品牌词库</label>
          <div class="keyword-tag-box" id="brand_terms_box" aria-label="品牌词库">
            <input id="brand_terms_input" type="text" placeholder="输入后回车添加，支持粘贴多行" autocomplete="off" />
          </div>
        </div>
        <div class="field">
          <label for="industry">行业标签（范例匹配用）</label>
          <input id="industry" placeholder="如：紧固件 / 跨境代理 / 家装板材" />
        </div>
        <div class="field">
          <label for="count">拓词数量</label>
          <input id="count" type="number" min="10" max="120" value="60" />
        </div>
      </div>
      <div class="form-footer">
        <button class="btn" id="run" type="button">生成选词报告</button>
      </div>
    </section>

    <section class="panel result">
      <p class="panel-title">结果</p>
      <div class="result-bar">
        <button class="btn ghost" id="histOpen" type="button">历史</button>
        <div class="actions" id="tools" style="display:none">
          <button class="btn ghost" id="batchRevise" type="button">批量修改</button>
          <button class="btn ghost" id="addExamples" type="button">勾选加入范例</button>
          <button class="btn ghost" id="addAllExamples" type="button">全部加入范例</button>
          <button class="btn ghost ding-only" id="push" type="button">推送到钉钉群</button>
          <button class="btn" id="docx" type="button">下载 Word 报告</button>
          <span class="muted" id="countHint"></span>
        </div>
      </div>
      <div class="result-scroll">
        <div id="status"></div>
        <div id="result"></div>
      </div>
    </section>
  </div>
</div>

<div id="reviseModal" class="revise-modal" aria-hidden="true">
  <div class="revise-backdrop" id="reviseBackdrop"></div>
  <div class="revise-panel" role="dialog" aria-modal="true" aria-labelledby="reviseTitle">
    <div class="revise-head">
      <h2 id="reviseTitle">修改这条词</h2>
      <button type="button" class="btn ghost icon" id="reviseClose">关闭</button>
    </div>
    <p class="revise-word muted" id="reviseWordPreview"></p>
    <div class="revise-body">
      <div class="revise-label">修改原因</div>
      <select id="reviseReason">
        <option value="">请选择修改原因</option>
        <option value="拓出的词提问AI大模型给出的标准答案为纯知识点和品牌或产品无关">拓出的词提问 AI 大模型给出的标准答案为纯知识点，和品牌或产品无关</option>
        <option value="拓出的词太长，要求精简短语">拓出的词太长，要求精简短语</option>
        <option value="custom">其他原因（下方填写）</option>
      </select>
      <textarea id="reviseCustomText" rows="3" placeholder="补充说明：希望怎么改…"></textarea>
    </div>
    <div class="revise-foot">
      <button type="button" class="btn ghost" id="reviseCancel">取消</button>
      <button type="button" class="btn" id="reviseSubmit">重新生成</button>
    </div>
  </div>
</div>

<div id="histDrawer" class="hist-drawer" aria-hidden="true">
  <div class="hist-backdrop" id="histBackdrop"></div>
  <aside class="hist-panel" role="dialog" aria-modal="true" aria-labelledby="histTitle">
    <div class="hist-head">
      <h2 id="histTitle">历史记录</h2>
      <button type="button" class="btn ghost icon" id="histClose">关闭</button>
    </div>
    <div class="hist-filter">
      <input id="histFilter" type="search" placeholder="按企业 / 产品筛选" autocomplete="off" />
    </div>
    <div id="historyList" class="history-list"><div class="muted" style="padding:8px 0">暂无记录</div></div>
  </aside>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const STAGES = ["需求萌生","品类筛选","品牌对比","产品选型","价格预算","同城渠道","决策下单","下单履约","售后维保","品牌专属"];
  const ALL_PLAT = ["豆包","DeepSeek","Kimi","通义","元宝","文心"];
  const LS_JOB = "geo.keyword_miner.job_id";
  const LS_TOUCH = "geo.keyword_miner.touch_ids";
  const LS_DRAFT = "geo.keyword_miner.draft";
  const LS_RESULT = "geo.keyword_miner.last_result";
  let selectedPlats = new Set(ALL_PLAT);
  let brandTerms = [];
  let current = { selection: [], expansion: {} };
  let editNotes = [];
  let lastDoneJobId = null;
  let reviseTargets = [];
  let pollTimer = null;
  let activeJobId = null;

  const embed = new URLSearchParams(location.search).has("embed") || window.self !== window.top;
  if (embed) document.body.classList.add("embed");

  const API_BASE = (() => {
    const p = location.pathname || "";
    if (p === "/keyword-miner" || p.startsWith("/keyword-miner/")) return "/keyword-miner";
    return "";
  })();
  function apiUrl(path) {
    return API_BASE + path;
  }
  function minerFetch(path, opts) {
    opts = opts || {};
    return fetch(apiUrl(path), Object.assign({}, opts, {
      credentials: "include",
      cache: opts.cache || "no-store",
    }));
  }

  // GEO 主库历史：同域 Cookie；父页 postMessage 可覆盖 apiBase/csrf
  let GEO_API_BASE = "/api/v1";
  let GEO_CSRF = "";
  let GEO_READY = !embed;
  const geoWaiters = [];
  function readCsrf() {
    if (GEO_CSRF) return GEO_CSRF;
    try {
      const m = document.cookie.match(/(?:^|;\s*)geo_csrf_token=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : "";
    } catch (_) { return ""; }
  }
  function geoUrl(path) {
    return String(GEO_API_BASE || "/api/v1").replace(/\/$/, "") + path;
  }
  async function geoFetch(path, opts) {
    opts = opts || {};
    const headers = Object.assign({}, opts.headers || {});
    const method = String(opts.method || "GET").toUpperCase();
    if (method !== "GET" && method !== "HEAD") {
      const csrf = readCsrf();
      if (csrf) headers["X-CSRF-Token"] = csrf;
    }
    const resp = await fetch(geoUrl(path), Object.assign({}, opts, {
      credentials: "include",
      headers,
      cache: opts.cache || "no-store",
    }));
    return resp;
  }
  function onGeoReady(fn) {
    if (GEO_READY) { fn(); return; }
    geoWaiters.push(fn);
  }
  window.addEventListener("message", (ev) => {
    if (!ev || ev.origin !== location.origin) return;
    const d = ev.data;
    if (!d || d.type !== "geo-km-bootstrap") return;
    // 仅允许同源父页覆盖 apiBase, 且必须仍是本站 /api 路径
    if (d.apiBase) {
      try {
        const u = new URL(String(d.apiBase), location.origin);
        if (u.origin === location.origin && u.pathname.startsWith("/api")) {
          GEO_API_BASE = (u.origin + u.pathname).replace(/\/$/, "");
        }
      } catch (_) {}
    }
    if (d.csrf != null) GEO_CSRF = String(d.csrf || "");
    GEO_READY = true;
    while (geoWaiters.length) {
      try { geoWaiters.shift()(); } catch (_) {}
    }
  });

  async function syncJobToGeo(job, opts) {
    if (!job || !job.job_id) return false;
    const quiet = !!(opts && opts.quiet);
    const body = {
      status: job.status,
      company: job.company || "",
      product: job.product || "",
      error: job.error || null,
      payload: job.payload || null,
      result: job.result || null,
      created_at: job.created_at || null,
      updated_at: job.updated_at || null,
      selection_count: job.selection_count,
      expansion_count: job.expansion_count,
      task: job.task,
      platforms: job.platforms,
      source: job.source,
      model: job.model,
      top_words: job.top_words,
    };
    try {
      const r = await geoFetch("/keyword-miner/jobs/" + encodeURIComponent(job.job_id), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        if (!quiet) {
          const errBody = await r.json().catch(() => ({}));
          const detail = errBody.detail || errBody.message || ("HTTP " + r.status);
          $("status").innerHTML = '<div class="banner demo"><span class="dot"></span>结果已生成, 但同步主库失败：'
            + esc(String(detail)) + '</div>';
        }
        return false;
      }
      return true;
    } catch (e) {
      if (!quiet) {
        $("status").innerHTML = '<div class="banner demo"><span class="dot"></span>结果已生成, 但同步主库失败：'
          + esc(e.message || String(e)) + '</div>';
      }
      return false;
    }
  }

  async function markJobGoneOnGeo(jobId) {
    if (!jobId) return;
    await syncJobToGeo({
      job_id: jobId,
      status: "error",
      error: "挖词服务已重启或任务过期, 请重新生成",
      updated_at: Date.now() / 1000,
    }, { quiet: true });
  }

  function idlePreviewHtml() {
    return (
      '<div class="ready">' +
        '<div class="ready-head">' +
          '<h2>填写左侧信息后生成报告</h2>' +
          '<p>至少填写企业名称、产品或客户资料之一，勾选目标 AI 平台，然后点「生成选词报告」。完成后可在此查看选词 / 拓词并下载 Word。</p>' +
        '</div>' +
      '</div>'
    );
  }

  function showIdlePreview() {
    $("tools").style.display = "none";
    $("result").innerHTML = idlePreviewHtml();
  }

  function hasResultPayload(data) {
    if (!data || typeof data !== "object") return false;
    const sel = data.selection || [];
    const exp = data.expansion || {};
    return !!(sel.length || Object.values(exp).some((a) => a && a.length));
  }

  function peekLastResult() {
    try {
      const raw = localStorage.getItem(LS_RESULT);
      if (!raw) return null;
      const data = JSON.parse(raw);
      return hasResultPayload(data) ? data : null;
    } catch (_) {
      return null;
    }
  }

  function lastResultLabel(data) {
    const company = String((data && data.meta && data.meta.company) || "").trim();
    const product = String((data && data.meta && data.meta.product) || "").trim();
    if (company && product) return company + " · " + product;
    return company || product || "上次结果";
  }

  function offerResumeLast() {
    if (activeJobId || pollTimer) return;
    const data = peekLastResult();
    if (!data) return;
    $("status").innerHTML =
      '<div class="banner resume" role="status">' +
        '<span class="dot"></span>' +
        '<span>继续上次：' + esc(lastResultLabel(data)) + '</span>' +
        '<button type="button" class="btn ghost" id="resumeLast">打开</button>' +
        '<button type="button" class="btn ghost" id="dismissLast">忽略</button>' +
      '</div>';
    const openBtn = $("resumeLast");
    const dismissBtn = $("dismissLast");
    if (openBtn) openBtn.onclick = () => openLastResult();
    if (dismissBtn) {
      dismissBtn.onclick = () => {
        try { localStorage.removeItem(LS_RESULT); } catch (_) {}
        $("status").innerHTML = "";
      };
    }
  }

  function openLastResult() {
    const data = peekLastResult();
    if (!data) {
      showIdlePreview();
      $("status").innerHTML = "";
      return;
    }
    current = { selection: data.selection || [], expansion: data.expansion || {} };
    editNotes = [];
    const meta = data.meta || {};
    if (meta.company && !$("company").value) $("company").value = meta.company;
    if (meta.product && !$("product").value) $("product").value = meta.product;
    render(data);
  }

  showIdlePreview();
  function renderPlats() {
    $("platforms").innerHTML = ALL_PLAT.map(p =>
      '<span class="pill ' + (selectedPlats.has(p) ? 'on' : '') + '" data-p="' + p + '" role="button" tabindex="0">' + p + '</span>'
    ).join('');
    [...$("platforms").children].forEach(el => {
      const toggle = () => {
        const p = el.dataset.p;
        if (selectedPlats.has(p)) selectedPlats.delete(p); else selectedPlats.add(p);
        renderPlats();
        saveDraft();
      };
      el.onclick = toggle;
      el.onkeydown = (ev) => {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
      };
    });
  }
  renderPlats();
  loadDraft();
  try {
    const resumeId = localStorage.getItem(LS_JOB);
    if (resumeId) {
      void pollJob(resumeId, loadTouchIds());
    } else {
      $("status").innerHTML = "";
      offerResumeLast();
    }
  } catch (_) {
    $("status").innerHTML = "";
    offerResumeLast();
  }
  onGeoReady(() => {});
  // 超时兜底：父页未及时 bootstrap 也放开 GEO 调用
  setTimeout(() => {
    if (!GEO_READY) {
      GEO_READY = true;
      while (geoWaiters.length) {
        try { geoWaiters.shift()(); } catch (_) {}
      }
    }
  }, 1500);

  ["company","product","web_url","task","materials","industry","count"].forEach(id => {
    const el = $(id);
    if (!el) return;
    el.addEventListener("change", saveDraft);
    el.addEventListener("input", () => {
      const field = el.closest(".field");
      if (field) field.classList.remove("is-error");
      saveDraft();
    });
  });

  function normalizeBrandTerms(list) {
    const out = [];
    const seen = new Set();
    (list || []).forEach((raw) => {
      String(raw || "").split(/[\n,，;；\t]+/).forEach((part) => {
        const term = part.trim();
        if (!term || seen.has(term)) return;
        seen.add(term);
        out.push(term);
      });
    });
    return out;
  }

  function renderBrandTerms() {
    const box = $("brand_terms_box");
    const input = $("brand_terms_input");
    if (!box || !input) return;
    [...box.querySelectorAll("i")].forEach((el) => el.remove());
    brandTerms.forEach((term, idx) => {
      const tag = document.createElement("i");
      tag.appendChild(document.createTextNode(term));
      const btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-label", "移除 " + term);
      btn.textContent = "×";
      btn.addEventListener("click", () => {
        brandTerms = brandTerms.filter((_, i) => i !== idx);
        renderBrandTerms();
        saveDraft();
      });
      tag.appendChild(btn);
      box.insertBefore(tag, input);
    });
  }

  function addBrandTerms(list) {
    const next = normalizeBrandTerms(list);
    if (!next.length) return;
    brandTerms = normalizeBrandTerms(brandTerms.concat(next));
    renderBrandTerms();
    saveDraft();
  }

  function commitBrandTermInput(clearOnly) {
    const input = $("brand_terms_input");
    if (!input) return;
    const val = (input.value || "").trim();
    if (val) addBrandTerms([val]);
    if (clearOnly !== false) input.value = "";
  }

  (function bindBrandTerms() {
    const input = $("brand_terms_input");
    const box = $("brand_terms_box");
    if (!input || !box) return;
    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        commitBrandTermInput();
      } else if (ev.key === "Backspace" && !input.value && brandTerms.length) {
        brandTerms = brandTerms.slice(0, -1);
        renderBrandTerms();
        saveDraft();
      }
    });
    input.addEventListener("blur", () => commitBrandTermInput());
    input.addEventListener("paste", (ev) => {
      const text = (ev.clipboardData || window.clipboardData).getData("text") || "";
      if (!/[\n,，;；\t]/.test(text)) return;
      ev.preventDefault();
      addBrandTerms([text]);
      input.value = "";
    });
    box.addEventListener("click", () => input.focus());
  })();

  $("filePick").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", async () => {
    const f = $("file").files[0]; if (!f) return;
    const nameEl = $("fileName");
    nameEl.textContent = f.name;
    nameEl.classList.add("has-file");
    $("filehint").textContent = "正在读取 " + f.name + " ...";
    const buf = await f.arrayBuffer();
    const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
    try {
      const r = await minerFetch("/api/ingest", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ filename: f.name, data: b64 }) });
      const d = await r.json();
      const cur = $("materials").value.trim();
      $("materials").value = (cur ? cur + "\n\n" : "") + (d.text || "");
      $("filehint").textContent = "已读入客户资料（" + (d.text||"").length + " 字）";
      saveDraft();
    } catch (e) {
      $("filehint").textContent = "读取失败：" + e.message;
      nameEl.textContent = "未选择文件";
      nameEl.classList.remove("has-file");
    }
  });

  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function saveDraft() {
    try {
      localStorage.setItem(LS_DRAFT, JSON.stringify({
        company: $("company").value,
        product: $("product").value,
        web_url: $("web_url").value,
        task: $("task").value,
        materials: $("materials").value,
        brand_terms: brandTerms.slice(),
        industry: $("industry").value,
        count: $("count").value,
        platforms: [...selectedPlats],
      }));
    } catch (_) {}
  }

  function loadDraft() {
    try {
      const raw = localStorage.getItem(LS_DRAFT);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d.company != null) $("company").value = d.company;
      if (d.product != null) $("product").value = d.product;
      if (d.web_url != null) $("web_url").value = d.web_url;
      if (d.task != null) $("task").value = d.task;
      if (d.materials != null) $("materials").value = d.materials;
      if (Array.isArray(d.brand_terms)) brandTerms = normalizeBrandTerms(d.brand_terms);
      else if (d.brand_terms != null) brandTerms = normalizeBrandTerms([String(d.brand_terms)]);
      renderBrandTerms();
      if (d.industry != null) $("industry").value = d.industry;
      if (d.count != null) $("count").value = d.count;
      if (Array.isArray(d.platforms) && d.platforms.length) {
        selectedPlats = new Set(d.platforms);
        renderPlats();
      }
    } catch (_) {}
  }

  function setJobId(id, touchIds) {
    activeJobId = id || null;
    try {
      if (id) {
        localStorage.setItem(LS_JOB, id);
        if (Array.isArray(touchIds)) {
          const cleaned = touchIds.map((x) => Number(x)).filter((n) => n > 0);
          if (cleaned.length) localStorage.setItem(LS_TOUCH, JSON.stringify(cleaned));
          else localStorage.removeItem(LS_TOUCH);
        }
      } else {
        localStorage.removeItem(LS_JOB);
        localStorage.removeItem(LS_TOUCH);
      }
    } catch (_) {}
  }

  function loadTouchIds() {
    try {
      const raw = localStorage.getItem(LS_TOUCH);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr.map((x) => Number(x)).filter((n) => n > 0) : [];
    } catch (_) {
      return [];
    }
  }

  function clearFieldErrors() {
    document.querySelectorAll(".field.is-error").forEach((el) => el.classList.remove("is-error"));
  }

  function markFieldError(id) {
    const el = $(id);
    if (!el) return;
    const field = el.closest(".field");
    if (field) field.classList.add("is-error");
  }

  function setRunIdle() {
    $("run").disabled = false;
    $("run").textContent = "生成选词报告";
  }

  function showRunning() {
    $("run").disabled = true;
    $("run").textContent = "生成中…";
    $("tools").style.display = "none";
    $("status").innerHTML = "";
    $("result").innerHTML =
      '<div class="ready ready-run">' +
        '<div class="ready-head">' +
          '<h2>正在生成选词报告…</h2>' +
          '<p>通常需要 1–3 分钟。完成后可在此查看结果并下载 Word。</p>' +
        '</div>' +
        '<div class="pulse" aria-hidden="true"><i></i></div>' +
      '</div>';
  }

  function stopPoll() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  function touchExampleIds(ids) {
    const cleaned = (ids || []).map((id) => Number(id)).filter((id) => id > 0);
    if (!cleaned.length) return;
    void geoFetch("/keyword-miner/examples/touch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: cleaned }),
    }).catch(() => {});
  }

  async function pollJob(jobId, touchIds) {
    stopPoll();
    // 显式传入数组(可为空)时覆盖旧 touchIds; 仅 resume 不传第二参时读 LS
    const pendingTouch = Array.isArray(touchIds) ? touchIds.slice() : loadTouchIds();
    setJobId(jobId, pendingTouch);
    showRunning();
    let lastSyncedStatus = null;
    let transientFails = 0;
    const failTerminal = (message) => {
      setJobId(null);
      setRunIdle();
      showIdlePreview();
      $("status").innerHTML = '<div class="banner demo"><span class="dot"></span>出错：' + esc(message) + '</div>';
    };
    const pauseKeepJob = (message) => {
      // 保留 LS_JOB, 刷新页面可续跑
      setRunIdle();
      $("status").innerHTML = '<div class="banner demo"><span class="dot"></span>' + esc(message) + '</div>';
    };
    const tick = async () => {
      try {
        const resp = await minerFetch("/api/jobs/" + encodeURIComponent(jobId), { cache: "no-store" });
        if (resp.status === 404) {
          await markJobGoneOnGeo(jobId);
          setJobId(null);
          showIdlePreview();
          $("status").innerHTML = '<div class="banner demo"><span class="dot"></span>上次任务已过期，请重新生成。</div>';
          setRunIdle();
          return;
        }
        if (!resp.ok) {
          transientFails += 1;
          if (transientFails >= 8) {
            pauseKeepJob("任务状态连续获取失败, 请刷新页面续跑或重新生成");
            return;
          }
          pollTimer = setTimeout(tick, 2000);
          return;
        }
        transientFails = 0;
        const job = await resp.json();
        if (job.error && job.status === "error") {
          await syncJobToGeo(job);
          failTerminal(job.error);
          return;
        }
        if (job.status === "done" && job.result) {
          await syncJobToGeo(job);
          touchExampleIds(pendingTouch);
          lastDoneJobId = jobId;
          setJobId(null);
          setRunIdle();
          const data = job.result;
          current = { selection: data.selection || [], expansion: data.expansion || {} };
          editNotes = [];
          if (data.meta) {
            if (data.meta.company && !$("company").value) $("company").value = data.meta.company;
            if (data.meta.product && !$("product").value) $("product").value = data.meta.product;
          }
          render(data);
          void loadHistory();
          return;
        }
        if (job.status === "queued" || job.status === "running") {
          // 仅状态变化时同步主库, 避免每 1.5s PUT 刷屏
          if (job.status !== lastSyncedStatus) {
            lastSyncedStatus = job.status;
            void syncJobToGeo(job, { quiet: true });
          }
          pollTimer = setTimeout(tick, 1500);
          return;
        }
        failTerminal(job.error || ("未知状态：" + job.status));
      } catch (e) {
        // 瞬时网络/解析异常: 保留 LS_JOB 并重试
        transientFails += 1;
        if (transientFails >= 8) {
          pauseKeepJob("网络异常, 请刷新页面续跑: " + (e.message || String(e)));
          return;
        }
        pollTimer = setTimeout(tick, 2000);
      }
    };
    await tick();
  }

  async function run() {
    clearFieldErrors();
    const company = $("company").value.trim();
    const product = $("product").value.trim();
    const materials = $("materials").value.trim();
    const web_url = $("web_url").value.trim();
    const count = $("count").value || 60;
    const task = $("task").value;
    const platforms = [...selectedPlats];
    if (!company && !product && !materials && !web_url) {
      markFieldError("company");
      markFieldError("product");
      markFieldError("materials");
      $("status").innerHTML = '<div class="banner demo"><span class="dot"></span>请至少填写企业名称、产品或客户资料之一。</div>';
      $("company").focus();
      return;
    }
    if (!platforms.length) {
      $("status").innerHTML = '<div class="banner demo"><span class="dot"></span>请至少勾选一个目标 AI 平台。</div>';
      return;
    }
    saveDraft();
    showRunning();
    try {
      let reference_examples = [];
      let edit_lessons = [];
      try {
        const industry = ($("industry").value || product || company || "").trim();
        const qs = new URLSearchParams({ industry, product, limit: "6" });
        const mr = await geoFetch("/keyword-miner/examples/match?" + qs.toString());
        if (mr.ok) {
          const md = await mr.json();
          const payload = (md && md.data) || md || {};
          reference_examples = Array.isArray(payload.items) ? payload.items : [];
          edit_lessons = Array.isArray(payload.edit_lessons) ? payload.edit_lessons : [];
        }
      } catch (_) {}
      const resp = await minerFetch("/api/mine", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ company, product, materials, web_url, count, task, platforms,
          brand_terms: brandTerms.slice(),
          reference_examples, edit_lessons }) });
      const data = await resp.json();
      if (data.error && !data.job_id) throw new Error(data.error);
      const touchIds = reference_examples.map((x) => x && x.id).filter((id) => Number(id) > 0);
      // 兼容旧同步接口：直接返回 selection 时再 touch
      if (data.selection || data.expansion) {
        touchExampleIds(touchIds);
        current = { selection: data.selection || [], expansion: data.expansion || {} };
        editNotes = [];
        lastDoneJobId = null;
        setRunIdle();
        render(data);
        return;
      }
      if (!data.job_id) throw new Error("未返回任务 ID");
      // 异步任务: 等 status=done 再 touch, 失败不加 use_count
      await pollJob(data.job_id, touchIds);
    } catch (e) {
      showIdlePreview();
      $("status").innerHTML = '<div class="banner demo"><span class="dot"></span>出错：' + esc(e.message) + '</div>';
      setRunIdle();
    }
  }

  let historyItems = [];
  let histFilterText = "";

  function openHistDrawer() {
    const drawer = $("histDrawer");
    if (!drawer) return;
    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
    void loadHistory();
    setTimeout(() => { try { $("histFilter").focus(); } catch (_) {} }, 0);
  }

  function closeHistDrawer() {
    const drawer = $("histDrawer");
    if (!drawer) return;
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
  }

  function paintHistory(items) {
    const box = $("historyList");
    if (!box) return;
    const q = histFilterText.trim().toLowerCase();
    const filtered = !q ? items : items.filter((it) => {
      const blob = [it.company, it.product, it.model, it.status].join(" ").toLowerCase();
      return blob.includes(q);
    });
    if (!filtered.length) {
      box.innerHTML = '<div class="muted" style="padding:8px 0">' + (items.length ? "无匹配记录" : "暂无记录") + "</div>";
      return;
    }
    const taskLabel = { both: "选词+拓词", select: "仅选词", expand: "仅拓词" };
    box.innerHTML = filtered.map(it => {
      const title = (it.company || it.product || "未命名").trim() || "未命名";
      const bits = [];
      if (it.product && it.product !== it.company) bits.push(it.product);
      bits.push(fmtTime(it.updated_at || it.created_at));
      const tags = [];
      if (it.task) tags.push(taskLabel[it.task] || it.task);
      tags.push("选词 " + (it.selection_count || 0));
      tags.push("拓词 " + (it.expansion_count || 0));
      if (it.model) tags.push(it.model);
      (it.platforms || []).slice(0, 4).forEach(p => tags.push(p));
      if ((it.platforms || []).length > 4) tags.push("+" + ((it.platforms || []).length - 4));
      const st = it.status === "done" ? "完成" : (it.status === "error" ? "失败" : "进行中");
      const cls = it.status === "done" ? "" : (it.status === "error" ? "bad" : "pending");
      return '<button type="button" class="history-item" data-id="' + esc(it.job_id) + '">' +
        '<div class="row1"><div class="t">' + esc(title) + '</div><span class="s ' + cls + '">' + st + '</span></div>' +
        (bits.length ? '<div class="m">' + esc(bits.join(" · ")) + '</div>' : '') +
        (tags.length ? '<div class="tags">' + tags.map(t => '<span class="tagx">' + esc(t) + '</span>').join("") + '</div>' : '') +
        '</button>';
    }).join("");
    [...box.querySelectorAll(".history-item")].forEach(el => {
      el.onclick = () => void openHistory(el.dataset.id);
    });
  }

  function fmtTime(ts) {
    if (!ts) return "";
    const d = new Date(Number(ts) * 1000);
    if (Number.isNaN(d.getTime())) return "";
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  async function loadHistory() {
    const box = $("historyList");
    if (!box) return;
    box.innerHTML = '<div class="muted" style="padding:8px 0">加载中…</div>';
    try {
      // 优先 GEO 主库；失败再回退本机 SQLite（独立打开页）
      let items = null;
      try {
        const r = await geoFetch("/keyword-miner/jobs?limit=50");
        if (r.ok) {
          const d = await r.json();
          items = (d && d.data && d.data.items) || (d && d.items) || [];
        }
      } catch (_) {}
      if (items == null) {
        const r = await minerFetch("/api/history?limit=50", { cache: "no-store" });
        const d = await r.json();
        items = d.items || [];
      }
      historyItems = items;
      paintHistory(historyItems);
    } catch (_) {
      box.innerHTML = '<div class="muted" style="padding:8px 0">历史加载失败</div>';
    }
  }

  function applyPayload(p) {
    if (!p || typeof p !== "object") return;
    if (p.company != null) $("company").value = p.company;
    if (p.product != null) $("product").value = p.product;
    if (p.web_url != null) $("web_url").value = p.web_url;
    if (p.task != null) $("task").value = p.task;
    if (p.materials != null) $("materials").value = p.materials;
    if (Array.isArray(p.brand_terms)) brandTerms = normalizeBrandTerms(p.brand_terms);
    else if (p.brand_terms != null) brandTerms = normalizeBrandTerms([String(p.brand_terms)]);
    renderBrandTerms();
    if (p.count != null) $("count").value = p.count;
    if (Array.isArray(p.platforms) && p.platforms.length) {
      selectedPlats = new Set(p.platforms);
      renderPlats();
    }
    saveDraft();
  }

  async function openHistory(jobId) {
    if (!jobId) return;
    try {
      let job = null;
      try {
        const r = await geoFetch("/keyword-miner/jobs/" + encodeURIComponent(jobId));
        if (r.ok) {
          const d = await r.json();
          job = (d && d.data) || d;
        }
      } catch (_) {}
      if (!job) {
        const resp = await minerFetch("/api/jobs/" + encodeURIComponent(jobId), { cache: "no-store" });
        if (!resp.ok) throw new Error("记录不存在");
        job = await resp.json();
      }
      if (job.payload) applyPayload(job.payload);
      else {
        if (job.company) $("company").value = job.company;
        if (job.product) $("product").value = job.product;
      }
      if (job.status === "done" && job.result) {
        lastDoneJobId = jobId;
        const preferred = job.edited_result || job.result || {};
        current = { selection: preferred.selection || [], expansion: preferred.expansion || {} };
        editNotes = Array.isArray(job.edit_notes) ? job.edit_notes : [];
        const meta = (job.result && job.result.meta) || preferred.meta || {};
        if (meta && !job.payload) {
          if (meta.company) $("company").value = meta.company;
          if (meta.product) $("product").value = meta.product;
          if (meta.task) $("task").value = meta.task;
          if (meta.count != null) $("count").value = meta.count;
          if (Array.isArray(meta.platforms) && meta.platforms.length) {
            selectedPlats = new Set(meta.platforms);
            renderPlats();
          }
        }
        closeHistDrawer();
        render(preferred);
        return;
      }
      if (job.status === "queued" || job.status === "running") {
        closeHistDrawer();
        await pollJob(jobId);
        return;
      }
      throw new Error(job.error || "该记录无可用结果");
    } catch (e) {
      closeHistDrawer();
      $("status").innerHTML = '<div class="banner demo"><span class="dot"></span>' + esc(e.message) + '</div>';
    }
  }

  function rowActionsHtml(kind, idx, stage) {
    const st = stage ? ' data-stage="' + esc(stage) + '"' : "";
    return '<div class="row-actions">'
      + '<button type="button" class="btn ghost tiny" data-act="revise" data-kind="' + kind + '" data-idx="' + idx + '"' + st + '>修改</button>'
      + '<button type="button" class="btn ghost tiny" data-act="example" data-kind="' + kind + '" data-idx="' + idx + '"' + st + '>加入范例</button>'
      + '</div>';
  }

  function bindResultActions() {
    $("result").querySelectorAll("[data-act='revise']").forEach((btn) => {
      btn.onclick = () => openReviseModal({
        kind: btn.getAttribute("data-kind"),
        idx: Number(btn.getAttribute("data-idx")),
        stage: btn.getAttribute("data-stage") || "",
      });
    });
    $("result").querySelectorAll("[data-act='example']").forEach((btn) => {
      btn.onclick = () => {
        void addOneExample({
          kind: btn.getAttribute("data-kind"),
          idx: Number(btn.getAttribute("data-idx")),
          stage: btn.getAttribute("data-stage") || "",
        });
      };
    });
  }

  function render(data) {
    saveDraft();
    try { localStorage.setItem(LS_RESULT, JSON.stringify(data)); } catch (_) {}
    void loadHistory();
    $("status").innerHTML = "";
    let html = "";
    if (current.selection.length) {
      html += '<h3>一、选词建议</h3>';
      html += "<table><thead><tr><th></th><th>关键词</th><th>类别</th><th>意图</th><th>评分</th><th>理由</th><th>操作</th></tr></thead><tbody>";
      current.selection.slice().sort((a,b)=>b.score-a.score).forEach((k, idx) => {
        // keep stable idx against unsorted source: map by word+score later via data-idx on sorted view
        const srcIdx = current.selection.indexOf(k);
        const w = Math.max(0,Math.min(100,k.score));
        html += "<tr data-kind='select' data-idx=\"" + srcIdx + "\"><td><input type='checkbox' data-f='pick' /></td>"
          + "<td>" + esc(k.word) + "</td>"
          + "<td>" + esc(k.category || "") + "</td>"
          + "<td>" + esc(k.intent || "") + "</td>"
          + "<td>" + w + "</td>"
          + "<td>" + esc(k.reason || "") + "</td>"
          + "<td>" + rowActionsHtml("select", srcIdx, "") + "</td></tr>";
      });
      html += "</tbody></table>";
    }
    const expStages = STAGES.filter(s => (current.expansion[s]||[]).length);
    if (expStages.length) {
      const total = expStages.reduce((n,s)=>n+current.expansion[s].length,0);
      html += '<h3 style="margin-top:18px">二、拓词清单（' + total + ' 条）</h3>';
      expStages.forEach(s => {
        const isBrand = (s === "品牌专属");
        html += '<div class="stage-h">' + s + '（' + current.expansion[s].length + '）</div>';
        html += "<table><thead><tr><th></th><th>" + (isBrand ? '拓词（含品牌名）' : '拓词') + "</th><th>热度</th><th>说明</th><th>答案要点</th><th>操作</th></tr></thead><tbody>";
        current.expansion[s].forEach((it, idx) => {
          const h = Math.max(0,Math.min(100,it.heat));
          html += "<tr data-kind='expand' data-stage=\""+esc(s)+"\" data-idx=\""+idx+"\"><td><input type='checkbox' data-f='pick' /></td>"
            + "<td>" + esc(it.word) + "</td>"
            + "<td>" + h + "</td>"
            + "<td>" + esc(it.note || "") + "</td>"
            + "<td>" + esc(it.answer || "") + "</td>"
            + "<td>" + rowActionsHtml("expand", idx, s) + "</td></tr>";
        });
        html += "</tbody></table>";
      });
    }
    if (!html) {
      showIdlePreview();
      $("status").innerHTML = "";
      offerResumeLast();
      return;
    }
    $("tools").style.display = (current.selection.length || expStages.length) ? "flex" : "none";
    $("countHint").textContent = "选词 " + current.selection.length + " · 拓词 " + (expStages.reduce((n,s)=>n+current.expansion[s].length,0));
    $("result").innerHTML = html;
    bindResultActions();
  }

  function collectPickedTargets() {
    const targets = [];
    document.querySelectorAll("#result tr[data-kind='select']").forEach((tr) => {
      if (!(tr.querySelector("[data-f='pick']") || {}).checked) return;
      targets.push({ kind: "select", idx: Number(tr.getAttribute("data-idx")), stage: "" });
    });
    document.querySelectorAll("#result tr[data-kind='expand']").forEach((tr) => {
      if (!(tr.querySelector("[data-f='pick']") || {}).checked) return;
      targets.push({
        kind: "expand",
        idx: Number(tr.getAttribute("data-idx")),
        stage: tr.getAttribute("data-stage") || "",
      });
    });
    return targets;
  }

  function itemFromTarget(target) {
    if (!target) return null;
    if (target.kind === "select") return current.selection[target.idx] || null;
    return (current.expansion[target.stage] || [])[target.idx] || null;
  }

  function openReviseModal(targetOrList) {
    const list = Array.isArray(targetOrList) ? targetOrList : [targetOrList];
    reviseTargets = list.filter((t) => itemFromTarget(t));
    if (!reviseTargets.length) return;
    if (reviseTargets.length === 1) {
      const item = itemFromTarget(reviseTargets[0]);
      $("reviseTitle").textContent = "修改这条词";
      $("reviseWordPreview").textContent = "原词：" + ((item && item.word) || "");
    } else {
      $("reviseTitle").textContent = "批量修改";
      $("reviseWordPreview").textContent = "已选 " + reviseTargets.length + " 条，将按同一原因逐条重新生成";
    }
    $("reviseReason").value = "";
    $("reviseCustomText").value = "";
    $("reviseModal").classList.add("open");
    $("reviseModal").setAttribute("aria-hidden", "false");
  }

  function closeReviseModal() {
    reviseTargets = [];
    $("reviseModal").classList.remove("open");
    $("reviseModal").setAttribute("aria-hidden", "true");
  }

  function pickedReviseReason() {
    let val = ($("reviseReason").value || "").trim();
    const custom = ($("reviseCustomText").value || "").trim();
    // 只填了文本框时, 默认当作「其他原因」
    if (!val && custom) {
      val = "custom";
      $("reviseReason").value = "custom";
    }
    if (!val) return "";
    if (val === "custom") return custom;
    return custom ? (val + "；" + custom) : val;
  }

  async function persistEditsSilent() {
    if (!lastDoneJobId) return;
    try {
      await geoFetch("/keyword-miner/jobs/" + encodeURIComponent(lastDoneJobId) + "/edits", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          edited_result: { selection: current.selection, expansion: current.expansion },
          edit_notes: editNotes,
        }),
      });
    } catch (_) {}
  }

  async function reviseOneTarget(target, reason) {
    const old = itemFromTarget(target);
    if (!old) throw new Error("找不到原词");
    const payload = {
      kind: target.kind,
      stage: target.stage || "",
      word: old.word,
      reason,
      company: $("company").value.trim(),
      product: $("product").value.trim(),
      materials: $("materials").value.trim(),
      web_url: $("web_url").value.trim(),
      platforms: [...selectedPlats],
      answer: old.answer || "",
      heat: old.heat,
      category: old.category || "",
      intent: old.intent || "",
      score: old.score,
    };
    const r = await minerFetch("/api/revise_word", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.error) throw new Error(d.error || ("HTTP " + r.status));
    const item = d.item;
    if (!item || !item.word) throw new Error("模型未返回新词");
    if (target.kind === "select") {
      current.selection[target.idx] = {
        word: item.word,
        category: item.category || old.category || "",
        intent: item.intent || old.intent || "",
        score: Number(item.score != null ? item.score : old.score) || 0,
        reason: item.reason || old.reason || "",
      };
    } else {
      current.expansion[target.stage][target.idx] = {
        word: item.word,
        heat: Number(item.heat != null ? item.heat : old.heat) || 0,
        note: item.note || old.note || "",
        answer: item.answer || old.answer || "",
      };
    }
    editNotes.push({
      kind: target.kind,
      stage: target.stage || "",
      word: item.word,
      old_word: old.word,
      reason,
    });
  }

  async function submitRevise() {
    if (!reviseTargets.length) return;
    let reason = pickedReviseReason();
    const selected = ($("reviseReason").value || "").trim();
    if (!selected && !reason) {
      alert("请选择修改原因，或在下方填写说明");
      return;
    }
    if (selected === "custom" && !reason) {
      alert("请填写其他原因");
      return;
    }
    if (!reason) reason = selected;
    const btn = $("reviseSubmit");
    const targets = reviseTargets.slice();
    btn.disabled = true;
    let done = 0;
    let failed = 0;
    let lastErr = "";
    try {
      for (const target of targets) {
        btn.textContent = "生成中 " + (done + 1) + "/" + targets.length + "…";
        try {
          await reviseOneTarget(target, reason);
          done += 1;
        } catch (e) {
          failed += 1;
          lastErr = e.message || String(e);
        }
      }
      closeReviseModal();
      render({ selection: current.selection, expansion: current.expansion });
      await persistEditsSilent();
      if (failed) {
        alert("完成 " + done + " 条，失败 " + failed + " 条" + (lastErr ? ("；末次：" + lastErr) : ""));
      }
    } finally {
      btn.disabled = false;
      btn.textContent = "重新生成";
    }
  }

  function exampleItemFromTarget(target) {
    if (target.kind === "select") {
      const x = current.selection[target.idx];
      if (!x) return null;
      return {
        kind: "select",
        stage: x.category || "",
        word: x.word,
        intent: x.intent || "",
        note: x.reason || "",
        edit_reason: "",
      };
    }
    const x = (current.expansion[target.stage] || [])[target.idx];
    if (!x) return null;
    return {
      kind: "expand",
      stage: target.stage,
      word: x.word,
      heat: x.heat,
      note: x.note || "",
      answer: x.answer || "",
      edit_reason: "",
    };
  }

  async function postExamples(items) {
    if (!items.length) {
      alert("请先勾选要入库的词");
      return;
    }
    const industry = ($("industry").value || $("product").value || "").trim();
    const resp = await geoFetch("/keyword-miner/examples/batch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        industry,
        source_job_id: lastDoneJobId,
        source_company: $("company").value.trim(),
        source_product: $("product").value.trim(),
        items,
      }),
    });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(body.detail || body.message || ("HTTP " + resp.status));
    const data = body.data || body;
    alert("已入库 " + (data.created || 0) + " 条，跳过重复 " + (data.skipped || 0) + " 条");
  }

  async function addOneExample(target) {
    const item = exampleItemFromTarget(target);
    if (!item) return;
    try {
      await postExamples([item]);
    } catch (e) {
      alert("入库失败：" + e.message);
    }
  }

  async function addExamplesBatch() {
    const items = collectPickedTargets().map(exampleItemFromTarget).filter(Boolean);
    try {
      await postExamples(items);
    } catch (e) {
      alert("入库失败：" + e.message);
    }
  }

  function collectAllExampleItems() {
    const items = [];
    current.selection.forEach((_, idx) => {
      const item = exampleItemFromTarget({ kind: "select", idx, stage: "" });
      if (item) items.push(item);
    });
    Object.keys(current.expansion || {}).forEach((stage) => {
      (current.expansion[stage] || []).forEach((_, idx) => {
        const item = exampleItemFromTarget({ kind: "expand", idx, stage });
        if (item) items.push(item);
      });
    });
    return items;
  }

  async function addAllExamples() {
    const items = collectAllExampleItems();
    if (!items.length) {
      alert("当前没有可入库的词");
      return;
    }
    if (!confirm("将把全部 " + items.length + " 条加入范例库，是否继续？")) return;
    try {
      await postExamples(items);
    } catch (e) {
      alert("入库失败：" + e.message);
    }
  }

    const targets = collectPickedTargets();
    if (!targets.length) {
      alert("请先勾选要修改的词");
      return;
    }
    openReviseModal(targets);
  };
  $("addExamples").onclick = () => { void addExamplesBatch(); };
  $("addAllExamples").onclick = () => { void addAllExamples(); };
  $("reviseClose").onclick = () => closeReviseModal();
  $("reviseCancel").onclick = () => closeReviseModal();
  $("reviseBackdrop").onclick = () => closeReviseModal();
  $("reviseCustomText").addEventListener("input", () => {

      $("reviseReason").value = "custom";
    }

  $("reviseSubmit").onclick = () => { void submitRevise(); };

  };

  $("run").onclick = run;
  $("histOpen").onclick = () => openHistDrawer();
  $("histClose").onclick = () => closeHistDrawer();
  $("histBackdrop").onclick = () => closeHistDrawer();
  $("histFilter").addEventListener("input", () => {
    histFilterText = $("histFilter").value || "";
    paintHistory(historyItems);
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && $("reviseModal").classList.contains("open")) {
      closeReviseModal();
      return;
    }
    if (ev.key === "Escape" && $("histDrawer").classList.contains("open")) {
      closeHistDrawer();
    }
  });
</script>
</body>
</html>

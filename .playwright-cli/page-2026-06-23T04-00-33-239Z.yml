                - generic [ref=e1074]: "# 2026小升初暑假衔接教辅推荐内容总结 ## 一、整体学习思路 小升初暑假学习分四步：查漏补缺小学知识→预习初一新课→专项强化训练→冲刺分班摸底；选书依据孩子基础区分：基础薄弱选讲解+基础习题款，中等水平适合讲练结合，优等生侧重拔高、分班备考。 ## 二、主流衔接教辅分类推荐 ### 1. 全科通用衔接首选 1. **一本《预备新初一》**：覆盖语数英+小四门，配套音视频讲解与闯关练习，附带42天预习规划、315节助学视频、230套月考卷，销量超百万，适合暑假整体预习。 2. **万唯《新初一分班考》**：题型配比小学80%+初中20%，含重点中学真题、考点梳理、6套预测卷，配套14天冲刺规划、114个高频考点，专门应对分班摸底测试。 ### 2. 单科专项教辅 1. **语文**：一本《初中文言文提前背》，汇总86首必背古诗文、53篇文言文，配漫画注释、140个动画视频，帮助提前吃透初中古诗文。 2. **数学** - 《教材帮 预习新初一》：知识点完整解析+配套视频，适合自主预习有理数、整式等初一内容； - 5·3《预习新初一》：30天系统预习规划，搭配大量基础习题与76节精讲视频，兼顾小学巩固与初一衔接。 3. **英语**：学而思《小初语法漫画学练》，漫画+口诀简化语法，配套1000道练习题，零基础也能入门小初衔接语法。 ## 三、6周暑假学习规划 1. 第1-2周：复盘小学知识，专项练习计算、字词； 2. 第3-4周：系统预习初一上册语数英主科； 3. 第5-6周：刷分班考卷、综合习题，整理复盘错题。 ## 四、附加信息 所有推荐教辅均为2026全国通用新版，店铺提供运费险、7天无理由退换；文末可根据孩子基础强弱、预算定制精简3本必买书单。"

# GEO Monitor — 通用 Nginx（本地/演示）快重回调分流
# 2026-08-21 - 与 www.aieokj.com.conf 同口径；前端开发仍可用 Vite 只打 8001

upstream geo_api_fast {
    server 127.0.0.1:8001;
    keepalive 16;
}

upstream geo_api_heavy {
    server 127.0.0.1:8002;
    keepalive 8;
}

upstream geo_api_callback {
    server 127.0.0.1:8003;
    keepalive 4;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 32m;
    root /opt/geo/AIEO_GEO/frontend/dist;
    index index.html;

    location = /api/v1/monitor/molizhishu/callback {
        proxy_pass http://geo_api_callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location ~ ^/api/v1/(monitor/(ranking-matrix|workspace-brief|summary|source-stats|snapshot-backfill)|analytics/) {
        proxy_pass http://geo_api_heavy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://geo_api_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

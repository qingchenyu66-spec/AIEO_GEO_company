# GEO Monitor — Nginx 反向代理与安全头模板
# 用法：复制到 /etc/nginx/sites-available/geo-monitor.conf 后按域名修改

upstream geo_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream geo_frontend {
    server 127.0.0.1:5173;   # 生产改为静态资源目录或前端构建产物 upstream
    keepalive 16;
}

# Flower 仅内网访问；生产务必设 FLOWER_BASIC_AUTH，且不要暴露到公网
upstream geo_flower {
    server 127.0.0.1:5555;
}

server {
    listen 443 ssl http2;
    server_name geo.example.com;

    # ssl_certificate     /etc/letsencrypt/live/geo.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/geo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- 安全响应头 ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # 生产启用 HSTS（确认全站 HTTPS 后再开）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP 按实际静态资源/CDN 调整
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self';" always;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://geo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://geo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 内网 IP 白名单示例（Flower）
    location /flower/ {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://geo_flower/;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name geo.example.com;
    return 301 https://$host$request_uri;
}

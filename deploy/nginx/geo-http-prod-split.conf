# GEO Monitor — 生产 HTTPS + 快/重/回调分流
# 2026-08-24 - 在 certbot 已签发的 www.aieokj.com 上叠加稳定性分流
# 部署：必须同时写入 sites-available 与 sites-enabled（见 deploy_prod.sh），再 nginx -t && reload
# 2026-09-18 - 仅写 available 时 enabled 旧单 upstream:8001 仍生效，滚动发布会整站 502

upstream geo_api_fast {
    least_conn;
    server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8011 max_fails=1 fail_timeout=5s;
    keepalive 32;
}

upstream geo_api_heavy {
    least_conn;
    server 127.0.0.1:8002 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8012 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

upstream geo_api_callback {
    least_conn;
    server 127.0.0.1:8003 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8013 max_fails=1 fail_timeout=5s;
    keepalive 8;
}

server {
    server_name www.aieokj.com aieokj.com 101.200.152.71 _;

    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/html is gzipped by default; listing it again triggers "duplicate MIME type" warn
    gzip_types text/plain text/css application/json application/javascript application/xml;

    root /opt/geo/AIEO_GEO/frontend/dist;
    index index.html;

    location = /api/v1/monitor/molizhishu/callback {
        proxy_pass http://geo_api_callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location ~ ^/api/v1/(monitor/(ranking-matrix|workspace-brief|summary|source-stats|snapshot-backfill)|analytics/) {
        proxy_pass http://geo_api_heavy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /api/ {
        proxy_pass http://geo_api_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # GEO选词：同域反代到本机 keyword-miner（iframe + /keyword-miner/api/*）
    location /keyword-miner/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /keyword-miner {
        return 301 /keyword-miner/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /report-assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.aieokj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.aieokj.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = aieokj.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = www.aieokj.com) {
        return 301 https://$host$request_uri;
    }

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.aieokj.com aieokj.com 101.200.152.71 _;
    return 404;
}

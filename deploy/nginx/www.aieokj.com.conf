# GEO Monitor — www.aieokj.com（快/重/回调三路上游）
# 2026-08-21 - 稳定性桌面方案②：Nginx 按路径分流，矩阵卡住不拖登录/回调
# 安装：
#   sudo cp deploy/nginx/www.aieokj.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/www.aieokj.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 证书（DNS 指向 101.200.152.71 后）：
#   sudo certbot --nginx -d www.aieokj.com -d aieokj.com

upstream geo_api_fast {
    least_conn;
    server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8011 max_fails=1 fail_timeout=5s;
    keepalive 32;
}

upstream geo_api_heavy {
    least_conn;
    server 127.0.0.1:8002 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8012 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

upstream geo_api_callback {
    least_conn;
    server 127.0.0.1:8003 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8013 max_fails=1 fail_timeout=5s;
    keepalive 8;
}

# 兼容旧单上游名（若其它 include 仍引用）
upstream geo_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.aieokj.com aieokj.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.aieokj.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aieokj.com;

    # ssl_certificate     /etc/letsencrypt/live/www.aieokj.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.aieokj.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self';" always;

    client_max_body_size 32m;
    root /opt/geo/AIEO_GEO/frontend/dist;
    index index.html;

    # 回调通道：短超时，模力只等入队
    location = /api/v1/monitor/molizhishu/callback {
        proxy_pass http://geo_api_callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # 重通道：矩阵 / 竞品 / 信源 / 工作台大读 / 报告类
    location ~ ^/api/v1/(monitor/(ranking-matrix|workspace-brief|summary|source-stats|snapshot-backfill)|analytics/) {
        proxy_pass http://geo_api_heavy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /api/ {
        proxy_pass http://geo_api_fast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /report-assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aieokj.com;

    return 301 https://www.aieokj.com$request_uri;
}

# GEO Monitor — www.aieokj.com
# 安装：
#   sudo cp deploy/nginx/www.aieokj.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/www.aieokj.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 证书（DNS 指向 101.200.152.71 后）：
#   sudo certbot --nginx -d www.aieokj.com -d aieokj.com

upstream geo_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.aieokj.com aieokj.com;

    # certbot 会改写本 server；未上证书前可先反代便于联调
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.aieokj.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aieokj.com;

    # certbot --nginx 会自动填入；手工时取消注释并改路径
    # ssl_certificate     /etc/letsencrypt/live/www.aieokj.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.aieokj.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self';" always;

    client_max_body_size 32m;
    root /opt/geo/AIEO_GEO/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://geo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # 2026-07-28 - 部署后旧 hash chunk 被 try_files 回成 index.html(200)，动态 import 失败
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /report-assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # 入口 HTML 禁止长期缓存，否则登录后仍拉已删除的 PortalView-xxxx.js
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # SPA：无实体文件时回退 index.html（勿覆盖 /assets/）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止把 Flower 挂到公网；需要时仅内网 + BASIC_AUTH
    # location /flower/ { ... }
}

# 根域强制到 www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aieokj.com;

    # ssl_certificate     /etc/letsencrypt/live/www.aieokj.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.aieokj.com/privkey.pem;

    return 301 https://www.aieokj.com$request_uri;
}

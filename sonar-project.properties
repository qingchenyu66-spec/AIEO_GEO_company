# 项目标识（必填，需唯一）
sonar.projectKey=geo_monitor
sonar.projectName=GEO Monitor
sonar.projectVersion=1.0

# 源代码目录
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/.venv/**

# SonarQube 服务器地址（CI 或本地扫描时配置）
# sonar.host.url=http://localhost:9000

# Token 通过环境变量注入，勿写入仓库：
#   set SONAR_TOKEN=your-token   (Windows)
#   export SONAR_TOKEN=your-token (Linux/macOS)
# sonar.token=${env:SONAR_TOKEN}

sonar.python.version=3.14

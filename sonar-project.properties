# GEO Monitor — SonarQube 扫描配置
# 文档：scripts/sonar-scan.ps1

sonar.projectKey=geo_monitor
sonar.projectName=GEO Monitor
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# 源码与测试
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*

# 排除：构建产物、迁移脚本、脚手架、第三方
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/storage/**,\
  **/migrations/**,\
  **/*.pyc,\
  frontend/src/components/HelloWorld.vue

sonar.test.exclusions=**/__pycache__/**

# Python
sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml

# 服务器与 Token 通过环境变量注入（勿写入仓库）
#   SONAR_HOST_URL=http://localhost:9000
#   SONAR_TOKEN=<从 SonarQube 用户设置生成>
sonar.host.url=${env:SONAR_HOST_URL}
sonar.token=${env:SONAR_TOKEN}

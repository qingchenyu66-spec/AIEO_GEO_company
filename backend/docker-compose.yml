services:
  redis:
    image: redis:7-alpine
    # Do not publish 6379 to the host; Redis stays on the compose network only.
    # For local debugging you may temporarily add: ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file:
      - .env
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      SCHEDULE_TOLERANCE_MINUTES: "60"
      MOLIZHISHU_SUBMIT_RATE_PER_MINUTE: "30"
      MOLIZHISHU_SYNC_RATE_PER_MINUTE: "60"
      DATABASE_POOL_SIZE: "20"
      DATABASE_MAX_OVERFLOW: "40"
    depends_on:
      - redis
    ports:
      - "8000:8000"

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      - redis

  celery-worker-submit-a:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -Q submit -n submit-a@%h -c 4 --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      - redis

  celery-worker-submit-b:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -Q submit -n submit-b@%h -c 4 --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      - redis

  celery-worker-sync-a:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -Q sync -n sync-a@%h -c 4 --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      - redis

  celery-worker-sync-b:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -Q sync -n sync-b@%h -c 4 --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      - redis

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    command: python scripts/start_flower.py
    env_file:
      - .env
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      FLOWER_URL: http://127.0.0.1:5555
    depends_on:
      - redis
    ports:
      - "5555:5555"

volumes:
  redis_data:

# Capacity note (50 tenants x 4 keyword groups):
# - ~200 submit jobs at 30/min ~ 7 minutes into Molizhishu
# - 2 submit workers x concurrency 4, still gated by Redis global rate limit
# - sync rate 60/min; scale submit/sync services as needed
